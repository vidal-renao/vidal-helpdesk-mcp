name: Audit

on:
  workflow_dispatch:
  schedule:
    # Once daily at 06:00 UTC. Was previously hourly ("0 * * * *"), which combined
    # with a schema-mismatch bug in the dedupe table (fixed 2026-07-22) caused up
    # to 9 duplicate emails in a single day. Delivery is also idempotent per UTC
    # calendar day now (src/lib/audit-runs.ts), so this schedule is redundant with,
    # not the sole guard against, duplicate sends.
    - cron: "0 6 * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Audit with Diagnostics
        shell: bash
        run: |
          set -u

          RESPONSE_BODY="response_body.txt"
          RESPONSE_HEADERS="response_headers.txt"

          if [ -z "${{ secrets.VIDAL_MCP_AUDIT_URL }}" ]; then
            echo "::error::VIDAL_MCP_AUDIT_URL secret is empty or not configured"
            exit 1
          fi

          if [ -z "${{ secrets.VIDAL_MCP_AUDIT_SECRET }}" ]; then
            echo "::error::VIDAL_MCP_AUDIT_SECRET secret is empty or not configured"
            exit 1
          fi

          AUDIT_ORIGIN=$(node -e 'console.log(new URL(process.argv[1]).origin)' "${{ secrets.VIDAL_MCP_AUDIT_URL }}")

          HTTP_CODE=$(curl --show-error --silent \
            --request POST "${{ secrets.VIDAL_MCP_AUDIT_URL }}" \
            --header "Origin: $AUDIT_ORIGIN" \
            --header "Authorization: Bearer ${{ secrets.VIDAL_MCP_AUDIT_SECRET }}" \
            --header "Content-Type: application/json" \
            --data '{"source":"github-actions","workflow":"audit"}' \
            --dump-header "$RESPONSE_HEADERS" \
            --output "$RESPONSE_BODY" \
            --write-out "%{http_code}")

          echo "HTTP status: $HTTP_CODE"

          echo "::group::Webhook response body"
          cat "$RESPONSE_BODY" || true
          echo "::endgroup::"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::group::Webhook response headers"
            sed -E 's/(authorization|cookie|set-cookie):.*/\1: [redacted]/Ig' "$RESPONSE_HEADERS" || true
            echo "::endgroup::"

            echo "::error::Remote audit failed with HTTP $HTTP_CODE"
            exit 1
          fi

          # Phase 4A.16: HTTP 200 alone proved nothing. Between 2026-07-26 and
          # 2026-07-28 every scheduled run was green while the endpoint returned
          # {"emailSent":false,"emailSkippedReason":"claim_failed"} and no email
          # was ever sent. The endpoint now maps a no-op to a non-2xx status, and
          # this second, independent assertion means a regression on either side
          # alone can no longer produce a false green.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const raw = readFileSync("response_body.txt", "utf8").trim();
            if (!raw) {
              console.log("::error::Audit endpoint returned an empty body");
              process.exit(1);
            }

            let body;
            try {
              body = JSON.parse(raw);
            } catch {
              console.log("::error::Audit endpoint returned a body that is not valid JSON");
              process.exit(1);
            }

            if (body.emailEnabled !== true) {
              console.log("::error::Audit email delivery is disabled (emailEnabled is not true)");
              process.exit(1);
            }

            const delivered = body.emailSent === true;
            // already_sent is only reported after the service re-reads the
            // persisted row and confirms status=sent for this exact
            // organization/report type/period/recipient idempotency key.
            const alreadySent = body.emailSkippedReason === "already_sent";

            if (!delivered && !alreadySent) {
              const reason = body.emailSkippedReason ?? body.deliveryVerdict ?? "unknown";
              console.log(`::error::Audit run did not deliver an email (reason: ${reason})`);
              process.exit(1);
            }

            console.log(delivered
              ? `OK: email delivered (audit run ${body.auditRun?.id ?? "unknown"})`
              : "OK: today report was already delivered; idempotency guard held");
          '

      # Dead-man's switch. The contract assertion above only fires if this run
      # executes and reaches it; it cannot detect the cron never firing (GitHub
      # disables scheduled workflows after 60 days of repository inactivity),
      # GitHub Actions being down, or this workflow being deleted. In all three
      # cases there is no run, no red, and nothing to notice.
      #
      # This step emits a liveness ping only on a healthy delivery — the step
      # after `exit 1` never runs — so the absence of a ping is the signal, and
      # an external service (healthchecks.io) raises the alarm. The alerting
      # channel must not be Resend: Resend is part of what is being watched.
      # Setup and coverage matrix: README.md, "Dead-man's switch".
      - name: Heartbeat (dead-man's switch)
        if: success()
        shell: bash
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          set -u

          if [ -z "${HC_PING_URL}" ]; then
            echo "::error::HC_PING_URL secret is empty or not configured; the dead-man's switch is disarmed"
            exit 1
          fi

          # Fail the job if the ping does not land: a monitor that silently
          # stopped being fed is the failure mode this whole step exists for.
          curl --fail --silent --show-error \
            --retry 3 --retry-connrefused --max-time 10 \
            --output /dev/null \
            "${HC_PING_URL}"

          echo "OK: liveness ping delivered"
